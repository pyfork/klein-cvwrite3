# betterjobs.puascari.com is the app: Cloudflare (proxied DNS) -> nginx (origin certificate) -> uvicorn on 127.0.0.1:8000.
# cvwrite3.puascari.com, the first address, only redirects to it: the app takes POSTs from one origin (CVWRITE_APP_ORIGIN).
# Installed at /etc/nginx/sites-available/cvwrite3.conf, linked from sites-enabled/. Uses the box's shared
# /etc/nginx/global/*.conf snippets and $from_cloudflare (conf.d/cloudflare-only-geo.conf).

server {
    listen 80;
    listen [::]:80;
    server_name betterjobs.puascari.com cvwrite3.puascari.com;
    return 301 https://betterjobs.puascari.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name betterjobs.puascari.com;

    # The Cloudflare origin certificate for this name (15 years); only Cloudflare's edge trusts it.
    ssl_certificate     /etc/ssl/cloudflare/betterjobs.puascari.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/betterjobs.puascari.com.key;
    include /etc/nginx/global/ssl-params.conf;
    include /etc/nginx/global/security-headers.conf;

    # Only Cloudflare's edge may connect. The app signs users in itself (an emailed code), and trusts
    # Cloudflare's CF-Connecting-IP header for its per-IP limit on codes because of this gate.
    if ($from_cloudflare = 0) { return 444; }

    # Master CV uploads are capped at 2 MB in the app.
    client_max_body_size 3m;

    # /healthz is for the uptime timer on the box only.
    location = /healthz { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # The app relies on this header to tell proxied requests from the box's own /healthz calls.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }

    # cvwrite3's request log is the app's own JSON line in journald; keep nginx's access log out of it.
    access_log off;
    error_log /var/log/nginx/cvwrite3.error.log warn;
}

# The first address keeps working, as a redirect (its own origin certificate stays).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cvwrite3.puascari.com;

    ssl_certificate     /etc/ssl/cloudflare/cvwrite3.puascari.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/cvwrite3.puascari.com.key;
    include /etc/nginx/global/ssl-params.conf;
    include /etc/nginx/global/security-headers.conf;

    if ($from_cloudflare = 0) { return 444; }

    return 301 https://betterjobs.puascari.com$request_uri;

    access_log off;
    error_log /var/log/nginx/cvwrite3.error.log warn;
}
