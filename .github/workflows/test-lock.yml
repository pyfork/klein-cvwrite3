# guard-builder-Opus5.5-agent
# Guard 3: test lock (AC-9 to AC-12). On every PR change, compares each
# locked check in the PR against its fingerprint in the lock file on main,
# and publishes the `test-lock` check signed by the reviewer app.
#
# pull_request_target: this file, the script, the plans and the locks all
# come from main, so a PR can't loosen its own lock. PR files are only
# fingerprinted, never run.
name: test-lock

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: test-lock-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  # kit-reviewer-Opus5.5-agent, 2026-11-01 (KIT-019): not named test-lock.
  # GitHub counted this job's own run as the required `test-lock` check too,
  # so after the owner's approval turned the app's check green, the job's
  # earlier red run still blocked the merge (tribble #165)
  compare-locks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: reviewer
    permissions:
      contents: read
    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          persist-credentials: false

      - name: Check out the PR into pr-head/
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
          fetch-depth: 0
          persist-credentials: false

      - name: Compare locked checks with main's fingerprints
        id: lock
        run: |
          if bash .github/scripts/test-lock.sh . pr-head > result.txt 2>&1; then
            echo "conclusion=success" >> "$GITHUB_OUTPUT"
          else
            echo "conclusion=failure" >> "$GITHUB_OUTPUT"
          fi
          cat result.txt
          echo "lane=$(bash .github/scripts/pr-lane.sh . pr-head)" >> "$GITHUB_OUTPUT"

      - name: Sign in as the reviewer app
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.REVIEWER_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
          permission-checks: write
          permission-pull-requests: read

      # kit-reviewer-Opus5.5-agent, 2026-11-01 (KIT-019): a plan PR, or one of
      # owner-owned files only, is red until the owner approves its head
      # commit; the approval, not a bypass, turns it green (owner-call.sh)
      - name: Publish the test-lock check
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
          OWNER: ${{ vars.GUARD_OWNER_LOGIN }}
          LANE: ${{ steps.lock.outputs.lane }}
          CONCLUSION: ${{ steps.lock.outputs.conclusion || 'failure' }}
        run: |
          title="test-lock: PASS"; [ "$CONCLUSION" = "success" ] || title="test-lock: BLOCKED"
          if [ "$CONCLUSION" != success ] && { [ "$LANE" = PLAN ] || [ "$LANE" = OWNED ]; }; then
            gh api "repos/$GH_REPO/pulls/$PR/reviews" --paginate | jq -s 'add // []' > reviews.json
            if bash .github/scripts/owner-call.sh reviews.json "$OWNER" "$SHA" "$LANE"; then
              CONCLUSION=success; title="test-lock: PASS (owner approved ${SHA:0:7})"
              printf '\nThe owner approved commit %s of this PR (lane %s), so the lines above are approved. A new push needs a new approval.\n' "${SHA:0:7}" "$LANE" >> result.txt
            else
              printf '\nLane %s: it turns green when the owner approves commit %s.\n' "$LANE" "${SHA:0:7}" >> result.txt
            fi
          fi
          jq -n --arg sha "$SHA" --arg c "$CONCLUSION" --arg t "$title" --rawfile s result.txt \
            '{name:"test-lock", head_sha:$sha, status:"completed", conclusion:$c, output:{title:$t, summary:$s}}' \
            | gh api -X POST "repos/$GH_REPO/check-runs" --input - --jq '.html_url'
          [ "$CONCLUSION" = "success" ]
