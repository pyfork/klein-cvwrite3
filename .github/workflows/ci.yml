# CI on sk24's platform (senior D1): Ubuntu 22.04 and its own Python 3.10.12, the hash-locked install
# exactly as the server does it, then the full test suite. build-engineer-Opus5.5-agent, 2026-10-24
#
# Supply chain: one action only, GitHub's own checkout, pinned by commit hash. No setup-python: the
# runner's system Python is the same Ubuntu build sk24 runs. No secrets, read-only token.
# The render tests run here too, as on sk24: poppler from Ubuntu's apt, the runner's Google Chrome, and the
# render flags from env.example. CVWRITE_REQUIRE_RENDER=1 makes a missing or broken tool fail the run instead of
# skipping the render tests, so a green run means the PDF rendered. build-engineer-Sonnet5.5-agent, 2026-10-27
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python is sk24's (3.10)
        run: python3 -c 'import sys; print(sys.version); assert sys.version_info[:2] == (3, 10)'

      - name: Install exactly as sk24 does
        run: bash scripts/install.sh .venv

      - name: Test-only packages (never on sk24)
        run: |
          grep -v '^-r' requirements-dev.txt | .venv/bin/pip install --only-binary :all: -r /dev/stdin

      - name: Render tools as sk24 has them (poppler from apt; Chrome and flags as env.example names them)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends poppler-utils
          grep -E '^CVWRITE_CHROME(_FLAGS)?=' env.example >> "$GITHUB_ENV"

      - name: Render tool versions
        run: |
          echo "runner: $(. /etc/os-release && echo "$PRETTY_NAME")"
          "$CVWRITE_CHROME" --version
          pdftotext -v
          pdfinfo -v

      - name: Tests
        shell: bash
        env:
          CVWRITE_REQUIRE_RENDER: "1"
        run: .venv/bin/python -m unittest discover tests -v 2>&1 | tee test.log

      - name: What ran
        if: always()
        run: |
          echo "skipped: $(grep -c "skipped '" test.log)"
          grep -E "skipped '|^Ran |^OK|^FAILED" test.log

  # The pre-push guard again, over the PR's commits (build-engineer-Opus5.5-agent, 2026-10-26).
  # Detection only: on a public repo a pushed branch is already public. The local hook is what prevents.
  # The private-strings list never leaves the Mac, so it's empty here; paths and IC numbers are checked.
  push-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Guard the PR's commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          : > .git/info/private-strings
          echo "refs/heads/pr $HEAD refs/heads/pr $BASE" | python3 githooks/pre-push
