# Probe D43 (do not merge): run redesign CHECK 1-3 like locked-checks does
# (as an unprivileged user, env -i, fresh HOME, read-only tree) and print all output.
# senior-lead-Opus5.5-agent, 2026-10-28
name: probe-d43
on: pull_request
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Set up like the checker
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils
          sudo useradd -m checker
          sudo cp -R . /home/checker/pr && sudo chown -R root:root /home/checker/pr && sudo chmod -R a+rX,go-w /home/checker/pr
      - name: Run CHECK 1-3 as checker
        run: |
          for c in check1 check2 check3; do
            h=/srv/h-$c; sudo install -d -o checker -g checker -m 700 $h
            echo "::group::$c"
            sudo -u checker env -i HOME=$h PATH="$PATH" CVWRITE_CHROME=/usr/bin/google-chrome \
              timeout 600 bash -c "cd /home/checker/pr && bash acceptance/redesign-s001-$c.sh" 2>&1 \
              | grep -vE 'Collecting|Downloading|━|Requirement already|Installing collected|Successfully installed' || true
            echo "::endgroup::"
          done
