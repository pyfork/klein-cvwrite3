# senior-lead-Opus5.5-agent, 2026-10-28 (senior D23)
# A new file that looks risky by its name must be on the risk map, or a
# risky change could merge as routine. pull_request_target: this file, the
# script and the risk map all come from main; the PR's files are only listed.
name: new-file-check

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: new-file-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  new-file-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/new-file-check.sh
            docs-public/guard-data/risk-map.txt
          sparse-checkout-cone-mode: false
      - name: New risky-looking files must be on the risk map
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/new-file-check.sh docs-public/guard-data/risk-map.txt
