<body class="signed-out">
<div class="app">
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <a class="brand" href="/" aria-label="Better Jobs home">Better Jobs</a>
  
  
</header>


<main id="main" tabindex="-1">
<section class="page">

<h1 class="title">Sign in to Better Jobs</h1>
<p class="lede">We'll email you a 6-digit code. No password.</p>

<form class="card stack" method="post" action="/signin">
  <label class="field"><span>Your email</span>
    <input type="email" name="email" value="" maxlength="254" autocomplete="email" autocapitalize="off" spellcheck="false" required autofocus></label>
  <button type="submit" class="btn btn-primary">Email me a code</button>
  <p class="hint">New here? Sign in with your email first, then ask to join.</p>
</form>
<p class="meta">Questions? Email privacy@puascari.com. <a href="/privacy">Privacy notice</a></p>

</section>
</main>
<footer class="foot">
  
  <a href="/privacy">Privacy notice</a>
